name: 걷는 길 데이터 갱신

on:
  schedule:
    - cron: "0 19 * * 0" # 매주 일요일 19:00 UTC = 월요일 04:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: OpenStreetMap 길 데이터로 그래프 만들기
        run: node scripts/build-walk-graph.js

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/walk
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "walk: $(TZ=Asia/Seoul date +%Y-%m-%d) (KST)"
            git pull --rebase
            git push
          fi
