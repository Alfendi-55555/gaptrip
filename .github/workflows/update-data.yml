name: 데이터 갱신

on:
  schedule:
    - cron: "0 20 * * *" # 매일 20:00 UTC = 다음 날 05:00 KST
  workflow_dispatch:
    inputs:
      debug_stations:
        description: "원본 행을 출력할 역 이름(쉼표로 구분, 확인용)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 서울 열린데이터광장에서 받기
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          DEBUG_STATIONS: ${{ inputs.debug_stations }}
        run: node scripts/fetch-data.js

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) (KST)"
            git pull --rebase
            git push
          fi
